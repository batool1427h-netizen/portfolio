<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المخزون الذكي</title>
    <!-- مكتبة مسح الباركود -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <!-- مكتبة التعرف على النصوص OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; text-align: center; }
        
        /* تنسيقات الشاشات */
        .auth-card { max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        .alert-box { padding: 15px; margin-bottom: 20px; border-radius: 8px; display: none; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="password"], input[type="tel"], input[type="number"], input[type="date"] { 
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
        }
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; margin-top: 5px; transition: 0.2s; }
        .btn-primary { background-color: #007bff; width: 100%; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-action { background-color: #007bff; }
        .btn-success { background-color: #28a745; }
        .btn-secondary { background-color: #6c757d; }
        .btn-danger { background-color: #dc3545; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        
        #scanner-container, #ocr-camera { width: 100%; height: 250px; background: #000; margin-top: 10px; display: none; position: relative; border-radius: 8px; overflow: hidden; }
        #scanner-container video, #ocr-camera video { width: 100%; height: 100%; object-fit: cover; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #007bff; color: white; }
        .expired { background-color: #ffcccc; color: #900; font-weight: bold; }
        .low-stock { background-color: #fff3cd; }
        
        .toggle-link { text-align: center; margin-top: 15px; color: #007bff; cursor: pointer; font-size: 0.9em; }
    </style>
</head>
<body>

<!-- 1. شاشة تسجيل الدخول وإنشاء الحساب -->
<div id="authSection" class="auth-card">
    <!-- نموذج تسجيل الدخول -->
    <div id="loginForm">
        <h2>تسجيل الدخول</h2>
        <div class="form-group">
            <label>رقم الهاتف أو اسم المستخدم:</label>
            <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم أو الهاتف">
        </div>
        <div class="form-group">
            <label>الرقم السري:</label>
            <input type="password" id="loginPassword" placeholder="أدخل الرقم السري">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">دخول</button>
        <div class="toggle-link" onclick="toggleAuth('register')">ليس لديك حساب؟ قم بإنشاء حساب جديد</div>
    </div>

    <!-- نموذج إنشاء حساب جديد -->
    <div id="registerForm" class="hidden">
        <h2>حساب جديد</h2>
        <div class="form-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="regUsername" placeholder="اسمك أو اسم المحل">
        </div>
        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="regPhone" placeholder="05XXXXXXXX">
        </div>
        <div class="form-group">
            <label>الرقم السري:</label>
            <input type="password" id="regPassword" placeholder="أدخل الرقم السري">
        </div>
        <button class="btn btn-primary" onclick="handleRegister()">إنشاء الحساب</button>
        <div class="toggle-link" onclick="toggleAuth('login')">لديك حساب بالفعل؟ تسجيل الدخول</div>
    </div>
</div>

<!-- 2. الشاشة الرئيسية للتطبيق (تظهر فقط بعد الدخول) -->
<div id="appSection" class="container hidden">
    <div class="header-bar">
        <div>
            <h2 style="margin:0; text-align:right;">نظام إدارة المخزون</h2>
            <small id="userWelcome" style="color:#666;"></small>
        </div>
        <button class="btn btn-danger" onclick="handleLogout()">تسجيل الخروج</button>
    </div>

    <!-- منطقة التنبيهات الفورية عند فتح التطبيق -->
    <div id="app-alerts"></div>

    <!-- نموذج إضافة منتج -->
    <div style="background: #eef2f5; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <h3>إضافة / تحديث منتج</h3>
        
        <div class="form-group">
            <label>الباركود:</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="barcode" placeholder="امسح الباركود أو أدخله">
                <button class="btn btn-action" onclick="startBarcodeScanner()">مسح الباركود</button>
            </div>
            <div id="scanner-container"></div>
        </div>

        <div class="form-group">
            <label>اسم المنتج وتاريخ الانتهاء (عبر الكاميرا OCR):</label>
            <button class="btn btn-secondary" onclick="startOCR()">مسح النص/التاريخ بالصورة</button>
            <span id="ocr-status" style="margin-right: 10px; font-size: 0.9em; color: #555;"></span>
            <div id="ocr-camera">
                <video id="ocr-video" autoplay></video>
                <button class="btn btn-success" style="position: absolute; bottom: 10px; right: 10px;" onclick="captureAndProcessOCR()">التقاط وقراءة</button>
            </div>
        </div>

        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="itemName" placeholder="اسم المنتج">
        </div>

        <div class="form-group">
            <label>تاريخ الانتهاء:</label>
            <input type="date" id="expiryDate">
        </div>

        <div class="form-group">
            <label>الكمية:</label>
            <input type="number" id="quantity" value="1" min="1">
        </div>

        <button class="btn btn-success" style="width:100%; font-size:16px;" onclick="addProduct()">حفظ المنتج في المخزن</button>
    </div>

    <!-- جدول المخزون -->
    <h3>جدول المواد</h3>
    <table>
        <thead>
            <tr>
                <th>الباركود</th>
                <th>اسم المادة</th>
                <th>تاريخ الانتهاء</th>
                <th>الكمية</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody id="inventoryTable">
            <!-- سيتم إضافة البيانات هنا -->
        </tbody>
    </table>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('users')) || [];
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    let inventory = [];

    // عند تحميل الصفحة
    window.onload = function() {
        if (currentUser) {
            showApp();
        } else {
            showAuth();
        }
    };

    // إدارة الحسابات والشاشات
    function toggleAuth(form) {
        if (form === 'register') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        } else {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
    }

    function handleRegister() {
        const username = document.getElementById('regUsername').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value.trim();

        if (!username || !phone || !password) {
            alert('يرجى تعبئة جميع الحقول!');
            return;
        }

        const userExists = users.some(u => u.phone === phone || u.username === username);
        if (userExists) {
            alert('اسم المستخدم أو رقم الهاتف مسجل مسبقاً!');
            return;
        }

        const newUser = { username, phone, password };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));

        currentUser = newUser;
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        
        alert('تم إنشاء الحساب بنجاح!');
        showApp();
    }

    function handleLogin() {
        const input = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        const user = users.find(u => (u.username === input || u.phone === input) && u.password === password);

        if (user) {
            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            showApp();
        } else {
            alert('بيانات الدخول غير صحيحة!');
        }
    }

    function handleLogout() {
        localStorage.removeItem('currentUser');
        currentUser = null;
        showAuth();
    }

    function showAuth() {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
    }

    function showApp() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('userWelcome').innerText = `أهلاً بك، ${currentUser.username} (${currentUser.phone})`;

        // تحميل مخزون المستخدم الحالي فقط
        inventory = JSON.parse(localStorage.getItem(`inventory_${currentUser.phone}`)) || [];
        checkAlertsOnLaunch();
        renderTable();
    }

    // 1. التنبيهات الفورية عند فتح التطبيق
    function checkAlertsOnLaunch() {
        const alertArea = document.getElementById('app-alerts');
        alertArea.innerHTML = '';
        const today = new Date().toISOString().split('T')[0];

        let expiredItems = [];
        let lowStockItems = [];

        inventory.forEach(item => {
            if (item.expiryDate && item.expiryDate <= today) {
                expiredItems.push(item.name);
            }
            if (parseInt(item.quantity) <= 5) {
                lowStockItems.push(`${item.name} (${item.quantity})`);
            }
        });

        if (expiredItems.length > 0) {
            alertArea.innerHTML += `
                <div class="alert-box alert-danger" style="display:block;">
                    <strong>تنبيه هائم:</strong> مواد منتهية الصلاحية: ${expiredItems.join(', ')}
                </div>`;
        }

        if (lowStockItems.length > 0) {
            alertArea.innerHTML += `
                <div class="alert-box alert-warning" style="display:block;">
                    <strong>تحذير كمية:</strong> مواد كميتها منخفضة: ${lowStockItems.join(', ')}
                </div>`;
        }
    }

    // 2. مسح الباركود
    function startBarcodeScanner() {
        const container = document.getElementById('scanner-container');
        container.style.display = 'block';

        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: container },
            decoder: { readers: ["code_128_reader", "ean_reader", "ean_8_reader"] }
        }, function(err) {
            if (err) { alert("تعذر فتح الكاميرا للباركود"); return; }
            Quagga.start();
        });

        Quagga.onDetected(function(result) {
            document.getElementById('barcode').value = result.codeResult.code;
            Quagga.stop();
            container.style.display = 'none';
        });
    }

    // 3. OCR مسح النصوص
    let videoStream = null;

    async function startOCR() {
        const ocrContainer = document.getElementById('ocr-camera');
        const video = document.getElementById('ocr-video');
        ocrContainer.style.display = 'block';

        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = videoStream;
        } catch (e) {
            alert("تعذر الوصول للكاميرا");
        }
    }

    async function captureAndProcessOCR() {
        const video = document.getElementById('ocr-video');
        const status = document.getElementById('ocr-status');
        
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('ocr-camera').style.display = 'none';

        status.innerText = "جاري قراءة النص والتاريخ...";

        try {
            const result = await Tesseract.recognize(canvas, 'eng+ara');
            const text = result.data.text;
            
            const dateMatch = text.match(/\d{2,4}[\/\.-]\d{1,2}[\/\.-]\d{2,4}/);
            if (dateMatch) {
                const rawDate = dateMatch[0].replace(/[\/\.]/g, '-');
                const parts = rawDate.split('-');
                if (parts[0].length === 4) {
                    document.getElementById('expiryDate').value = rawDate;
                } else if (parts[2].length === 4) {
                    document.getElementById('expiryDate').value = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                }
            }

            const lines = text.split('\n').filter(l => l.trim().length > 2);
            if (lines.length > 0) {
                document.getElementById('itemName').value = lines[0].trim();
            }

            status.innerText = "تمت القراءة بنجاح!";
        } catch (err) {
            status.innerText = "فشلت القراءة، يرجى الإدخال يدوياً.";
        }
    }

    // 4. حفظ البيانات
    function addProduct() {
        const barcode = document.getElementById('barcode').value;
        const name = document.getElementById('itemName').value;
        const expiryDate = document.getElementById('expiryDate').value;
        const quantity = document.getElementById('quantity').value;

        if (!name) { alert("يرجى إدخال اسم المنتج"); return; }

        inventory.push({ barcode, name, expiryDate, quantity });
        localStorage.setItem(`inventory_${currentUser.phone}`, JSON.stringify(inventory));

        document.getElementById('barcode').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('expiryDate').value = '';
        document.getElementById('quantity').value = '1';

        checkAlertsOnLaunch();
        renderTable();
    }

    // 5. عرض الجدول
    function renderTable() {
        const tbody = document.getElementById('inventoryTable');
        tbody.innerHTML = '';
        const today = new Date().toISOString().split('T')[0];

        inventory.forEach((item) => {
            let rowClass = '';
            let statusText = 'سليم';

            if (item.expiryDate && item.expiryDate <= today) {
                rowClass = 'expired';
                statusText = 'منتهي الصلاحية';
            } else if (parseInt(item.quantity) <= 5) {
                rowClass = 'low-stock';
                statusText = 'منخفض الكمية';
            }

            tbody.innerHTML += `
                <tr class="${rowClass}">
                    <td>${item.barcode || '-'}</td>
                    <td>${item.name}</td>
                    <td>${item.expiryDate || '-'}</td>
                    <td>${item.quantity}</td>
                    <td>${statusText}</td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
